[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/assets/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/logo-mark.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/servicos"
  to = "/servicos/"
  status = 301

[[redirects]]
  from = "/servicos/lavagem-tecnica/*"
  to = "/servicos/"
  status = 301

[[redirects]]
  from = "/servicos/higienizacao-interna/*"
  to = "/servicos/higienizacao-avancada/"
  status = 301

[[redirects]]
  from = "/servicos/polimento-automotivo/*"
  to = "/servicos/polimento-comercial/"
  status = 301

[[redirects]]
  from = "/servicos/vitrificacao/*"
  to = "/servicos/"
  status = 301

[[redirects]]
  from = "/servicos/detalhamento/*"
  to = "/servicos/lavagem-detalhada/"
  status = 301

[[redirects]]
  from = "/servicos/revitalizacao/*"
  to = "/servicos/adicionais/"
  status = 301

